services:
  postgres:
    image: postgres:16-alpine
    container_name: stockintel-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: stockintel
      POSTGRES_PASSWORD: stockintel
      POSTGRES_DB: stockintel
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockintel -d stockintel"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stockintel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    env_file:
      - .env
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: stockintel-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    # The real database lives in the sibling `deploy` compose project
    # (container deploy-db-1). Join its network durably so DATABASE_URL's
    # hostname resolves after every recreate — a manual `docker network connect`
    # is lost on the next `docker compose up`, which previously left the backend
    # unable to reach the DB at boot (EAI_AGAIN), silently skipping the monitored
    # signal restore and collapsing "Monitored Signals".
    networks:
      - default
      - deploy_default
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-stockintel}:${POSTGRES_PASSWORD:?set a strong password in .env}@deploy-db-1:5432/${POSTGRES_DB:-stockintel}?sslmode=disable
      REDIS_URL: redis://redis:6379
      # Local Vite dev server origin. In production set this to your Netlify URL.
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:5173}"
      LOG_REQUESTS: "1"
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/healthz', r => process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  redis_data:

networks:
  deploy_default:
    external: true
