# StocksIntels self-hosted stack for a single Hetzner CX22 (2 vCPU / 4 GB / 40 GB)
# Usage:  sudo docker compose -f deploy/docker-compose.yml up -d
# Stops metering: flat $/mo for app + Postgres + Nginx on one box.
# Backend image, browser deps and storage all run locally.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong password in .env}
      POSTGRES_DB: ${POSTGRES_DB:-stockintel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockintel} -d ${POSTGRES_DB:-stockintel}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Only reachable inside the compose network; never expose on a public port.
    expose:
      - "5432"

  backend:
    # Build from the repo root so the Dockerfile can COPY ../frontend and the
    # pnpm workspace files. context = repo root, dockerfile = backend/Dockerfile.
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      LOG_REQUESTS: "1"
      DATABASE_URL: postgres://${POSTGRES_USER:-stockintel}:${POSTGRES_PASSWORD:?set a strong password in .env}@db:5432/${POSTGRES_DB:-stockintel}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://admin.stocksintels.com}
      # Runtime secrets / API keys passed through from the host .env
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_ENFORCE: ${TURNSTILE_ENFORCE:-0}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://admin.stocksintels.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    volumes:
      # Uploads must survive container rebuilds.
      - uploads:/app/backend/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/healthz',r=>process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  reverse_proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    # No healthcheck needed; Nginx starts fast and Docker restart handles it.

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    # Renewals only (runs every 12h). Do the INITIAL issuance manually via:
    #   docker compose -f deploy/docker-compose.yml run --rm --entrypoint certbot certbot certonly \
    #     --webroot -w /var/www/certbot -d admin.stocksintels.com \
    #     --email you@example.com --agree-tos --no-eff-email
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"

volumes:
  pgdata:
  uploads:
  certbot-webroot:
  letsencrypt:
