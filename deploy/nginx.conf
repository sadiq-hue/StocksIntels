# StocksIntels Nginx config for Hetzner.
# Terminates TLS (Let's Encrypt), reverse-proxies to the backend container,
# and forwards WebSocket upgrade headers for Socket.IO (admin/chat/notifications).
#
# Place at deploy/nginx.conf -> mounted into the reverse_proxy container.
#
# Serves three hostnames on one backend:
#   admin.stocksintels.com        -> admin panel (backend/admin.html)
#   stocksintels.com / www.       -> customer SPA (backend/frontend/dist)

# Socket.IO needs the upgrade to 101 Switching Protocols.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP: ACME challenges + redirect to HTTPS ────────────────────────
server {
    listen 80;
    server_name admin.stocksintels.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name stocksintels.com www.stocksintels.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: admin panel ───────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name admin.stocksintels.com;

    ssl_certificate     /etc/letsencrypt/live/admin.stocksintels.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.stocksintels.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Larger header size to match the backend's --max-http-header-size=100000000
    # (needed for large JWTs / long headers the app relies on).
    large_client_header_buffers 8 128k;

    # Gzip for static + API responses.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Uploads written by the backend (served statically).
    location /uploads/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
    }

    # Main API + admin panel.
    location / {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Socket.IO path.
    location /socket.io/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}

# ── HTTPS: customer SPA ──────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name stocksintels.com www.stocksintels.com;

    ssl_certificate     /etc/letsencrypt/live/stocksintels.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stocksintels.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    large_client_header_buffers 8 128k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /uploads/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Socket.IO path.
    location /socket.io/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}